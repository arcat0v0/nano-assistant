name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag || steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Use pushed tag
        id: resolve
        if: github.event_name == 'push'
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current=$(awk -F'"' '/^\[/{p=($0=="[package]")} p && /^version = /{print $2;exit}' Cargo.toml)
          [ -n "$current" ] || { echo "::error::cannot read version from Cargo.toml"; exit 1; }

          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump level: $BUMP"; exit 1 ;;
          esac
          new="$major.$minor.$patch"
          tag="v$new"

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          awk -v v="$new" '/^\[/{p=($0=="[package]")} p && /^version = /{sub(/"[^"]+"/, "\"" v "\"")} {print}' Cargo.toml > Cargo.toml.bumped
          mv Cargo.toml.bumped Cargo.toml

          cargo metadata --format-version 1 > /dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "🔖 chore(release): bump version to $tag"
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: x86_64-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - name: aarch64-linux-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || '' }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          tar czf "na-${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" na
          sha256sum "na-${{ matrix.name }}.tar.gz" > "na-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: na-${{ matrix.name }}.*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/*
            install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
